<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e6b57">
  <title>You're offline - OpenLibrary</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .offline-wrap { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .offline-wrap img { width: 64px; height: 64px; margin-bottom: 1.2rem; }
    .offline-wrap h1 { margin-bottom: .6rem; }
    .offline-wrap p { color: var(--muted); max-width: 40ch; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <main class="offline-wrap">
    <img src="favicon.svg" alt="">
    <h1>You're offline</h1>
    <p>This page needs an internet connection to load books and your account. Pages you've already visited may still work from where you left off.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
